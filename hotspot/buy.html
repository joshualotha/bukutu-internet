<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buku Tu Internet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0f2f5;color:#333;padding-bottom:40px}
.header{background:linear-gradient(135deg,#1a73e8,#0d47a1);color:#fff;padding:20px;text-align:center}
.header h1{font-size:22px}.header p{font-size:13px;opacity:.85;margin-top:4px}
.mac{font-size:11px;opacity:.7;margin-top:6px;background:rgba(255,255,255,.15);display:inline-block;padding:3px 10px;border-radius:20px}
.plans{max-width:600px;margin:15px auto;padding:0 12px}
.section{margin-bottom:18px}
.speed{background:#fff;padding:12px 16px;border-radius:12px 12px 0 0;border-left:4px solid #1a73e8;font-weight:700;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card{background:#fff;padding:14px 16px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.card:last-child{border-radius:0 0 12px 12px;border-bottom:none}
.card h3{font-size:15px;margin-bottom:2px}.card span{font-size:12px;color:#888}
.price{font-size:20px;font-weight:700;color:#1a73e8;text-align:right}
.buy{background:#1a73e8;color:#fff;border:none;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:4px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:15px;padding:25px;max-width:360px;width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal-box h2{font-size:19px;margin-bottom:5px}
.modal-box .pn{color:#1a73e8;font-weight:700;font-size:17px}
.modal-box .pp{font-size:28px;font-weight:700;margin:8px 0 18px}
.inp{width:100%;padding:13px 14px;font-size:16px;border:2px solid #ddd;border-radius:10px;margin-bottom:10px}
.inp:focus{border-color:#1a73e8;outline:none}
.btns{display:flex;gap:10px;margin-top:12px;justify-content:center}
.cancel{background:#eee;color:#555;border:none;padding:11px 22px;border-radius:8px;font-size:14px;cursor:pointer}
.ok{background:#1a73e8;color:#fff;border:none;padding:11px 26px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.footer{text-align:center;padding:20px;color:#aaa;font-size:12px}
.help{font-size:11px;color:#999;margin-top:4px}
.err{background:#fff0f0;color:#c00;padding:12px;border-radius:10px;margin-bottom:12px;text-align:center;border:1px solid #fcc;font-size:13px}
</style>
</head>
<body>
<div class="header">
<h1>Buku Tu Internet</h1>
<p>Select a package to get connected</p>
<div class="mac">Device: <strong>$(mac)</strong></div>
</div>

<div class="plans" id="plans">
<div style="text-align:center;padding:40px;color:#999">Loading packages...</div>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<h2>Buy Package</h2>
<div class="pn" id="mpn"></div>
<div class="pp" id="mpp"></div>
<form method="POST" action="http://198.54.114.198/api_pay.php">
<input type="hidden" name="plan_id" id="mpi">
<input type="hidden" name="device_mac" value="$(mac)">
<input type="text" name="phone" class="inp" placeholder="Phone number (e.g. 0712345678)" required>
<div class="help">Payment confirmation via mobile money</div>
<div class="btns">
<button type="button" class="cancel" onclick="closeModal()">Cancel</button>
<button type="submit" class="ok">Pay with Pesapal</button>
</div>
</form>
</div>
</div>

<div class="footer">Buku Tu Internet</div>

<script>
function buy(id,name,price){
 document.getElementById('mpi').value=id;
 document.getElementById('mpn').textContent=name;
 document.getElementById('mpp').textContent='TZS '+Number(price).toLocaleString();
 document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

// Fetch plans from portal
fetch('https://test.africanpishonsafaris.co.tz/buy.php?ajax=1')
.then(r=>r.text())
.then(h=>{document.getElementById('plans').innerHTML=h;})
.catch(e=>{
 document.getElementById('plans').innerHTML='<div class="err">Could not load packages. <br><small>Try reconnecting to WiFi</small></div>';
});
</script>
</body>
</html>
